name: handy_tdlib_next
description: >-
  Flutter/Dart TDLib (libtdjson) bindings maintained by Abdul Moiz Dev.
  JSON interface for building Telegram clients on Android.
version: 2.3.15
homepage: https://itxmoizdev.com
repository: https://github.com/itxmoizdev/handy-tdlib-next
issue_tracker: https://github.com/itxmoizdev/handy-tdlib-next/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.15.0"

dependencies:
  flutter:
    sdk: flutter

  ffi: ^2.1.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true

false_secrets:
  - /android/src/main/jniLibs/*/*.so
